# The ten recruiting posters, as the trainer's title screen hangs them.
# `alt` describes the poster and gives its slogan.
- n: 1
  alt: "A ghost running dark across a planet's sunlit limb: Volunteer for the boats"
- n: 2
  alt: "A carrier under way beside a planet, a craft away and an escort below: The fleet goes where it is needed"
- n: 3
  alt: "A ghost in silhouette against a rising moon: The silent service needs you"
- n: 4
  alt: "Two boats in company through a nebula: Hunt together. Come home together."
- n: 5
  alt: "A ghost's torpedo running to its target: One shot. Make it count."
- n: 6
  alt: "Three merchant ships in convoy: Keep 'em sailing"
- n: 7
  alt: "A ship's sound spreading in rings toward a boat that listens: The enemy is listening"
- n: 8
  alt: "A boat giving itself away in rings of signal, and a torpedo on its way: Loose lips sink boats"
- n: 9
  alt: "A ghost beneath a spiral galaxy: Join the fleet. See the stars."
- n: 10
  alt: "Searchlights over a planet's limb: Buy war bonds"
